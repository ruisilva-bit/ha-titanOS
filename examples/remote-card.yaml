type: vertical-stack
cards:
- type: grid
  columns: 4
  square: false
  cards:
  - type: custom:button-card
    name: Wake
    icon: mdi:power-on
    show_state: false
    tap_action: {action: perform-action, perform_action: remote.turn_on, target: {entity_id: remote.your_tv}, confirmation: {text: 'Send this power command to the TV?'}}
    hold_action: {action: none}
    double_tap_action: {action: none}
    styles: {card: [{height: 52px}], icon: [{--mdc-icon-size: 26px}]}
  - type: custom:button-card
    name: Standby
    icon: mdi:power-standby
    show_state: false
