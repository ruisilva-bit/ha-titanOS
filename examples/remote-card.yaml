type: vertical-stack
cards:
- type: markdown
  content: '## Philips TV Remote

    Local control · Titan OS'
- type: grid
  columns: 3
  square: false
  cards:
  - type: button
    name: Wake
    icon: mdi:power-on
    show_state: false
    icon_height: 28px
    tap_action:
      action: perform-action
      perform_action: remote.turn_on
      target:
        entity_id: remote.your_tv
      confirmation:
        title: TV power
        text: Send this power command to the TV?
        confirm_text: Send command
        dismiss_text: Cancel
    hold_action:
      action: none
    double_tap_action:
      action: none
  - type: button
    name: Sources
    icon: mdi:video-input-hdmi
    show_state: false
    icon_height: 28px
    tap_action:
      action: perform-action
      perform_action: remote.send_command
      target:
        entity_id: remote.your_tv
      data:
        command:
        - Source
        num_repeats: 1
        delay_secs: 0.3
    hold_action:
      action: none
    double_tap_action:
      action: none
  - type: button
    name: Standby
    icon: mdi:power-standby
    show_state: false
    icon_height: 28px
    tap_action:
      action: perform-action
      perform_action: remote.turn_off
      target:
        entity_id: remote.your_tv
      confirmation:
        title: TV power
        text: Send this power command to the TV?
        confirm_text: Send command
        dismiss_text: Cancel
    hold_action:
      action: none
    double_tap_action:
      action: none
